<!DOCTYPE html>
<html>
<head>
<style>
.marquee-wrapper {
  flex: 1;
  overflow: hidden;
  white-space: nowrap;
  display: flex;
  align-items: center;
  background: #eee;
  border: 1px solid #ccc;
  border-radius: 8px;
  height: 36px;
  margin: 0 1rem;
  position: relative;
  width: 300px;
}

.marquee-content {
  display: inline-block;
  padding-left: 100%;
  animation: marquee-scroll 5s linear infinite;
  white-space: nowrap;
}

@keyframes marquee-scroll {
  0% { transform: translateX(0); }
  100% { transform: translateX(-100%); }
}
</style>
</head>
<body>
  <div class="marquee-wrapper">
    <div class="marquee-content">
      Teacher: This is a test message. Student: This is another message.
    </div>
  </div>
</body>
</html>
